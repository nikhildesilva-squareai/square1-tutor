<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Square 1 AI">
  <defs>
    <linearGradient id="sq1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4482E5"/>
      <stop offset="100%" stop-color="#075BCC"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sq1-bg)"/>

  <!-- The brand mark: full top + left edges, a short right stub, and a bottom
       edge that stops short so the bottom-right corner stays OPEN. The S of the
       wordmark nests into that opening, exactly as it does in the full lockup.
       Square (butt) ends, so these are rects rather than a stroked path. -->
  <g fill="#FFFFFF">
    <rect x="10" y="15" width="30" height="3.6"/>
    <rect x="10" y="15" width="3.6" height="30"/>
    <rect x="36.4" y="15" width="3.6" height="9.6"/>
    <rect x="10" y="41.4" width="17" height="3.6"/>
  </g>

  <!-- "S1" drawn as paths, not <text>. An SVG favicon is rendered by the browser
       with whatever font it can find, and a substituted face would change the
       letterforms and the width at the one size where there is no room to
       absorb it. Paths render identically everywhere. -->
  <g fill="#FFFFFF">
    <!-- S -->
    <path d="M33.86 30.2c-3.98 0-6.9 2.36-6.9 5.72 0 3.02 2.02 4.62 5.3 5.44l1.86.46c1.9.48 2.62 1.06 2.62 2.06 0 1.2-1.12 2-2.9 2-2 0-3.32-.92-3.86-2.62l-3.5 1.72c1 3.04 3.72 4.72 7.36 4.72 4.28 0 7.18-2.34 7.18-5.94 0-2.98-1.9-4.62-5.42-5.5l-1.86-.46c-1.72-.42-2.5-1-2.5-1.96 0-1.1 1-1.86 2.62-1.86 1.74 0 2.88.8 3.4 2.28l3.42-1.76c-1.02-2.74-3.4-4.3-6.82-4.3z"/>
    <!-- 1 -->
    <path d="M48.9 30.5l-5.6 2.3 1.02 3.34 2.9-1.06v14.16h4.06V30.5z"/>
  </g>
</svg>
